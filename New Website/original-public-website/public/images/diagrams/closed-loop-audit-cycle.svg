<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Header / Title -->
  <text x="450" y="46" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a">The Closed-Loop Audit &amp; CAPA Lifecycle</text>
  <text x="450" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">How proof-based audits resolve operational issues from field inspection to verified closure</text>

  <!-- Connection Lines (Dashed Arrows) -->
  <path d="M 180 180 L 230 180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <path d="M 370 180 L 420 180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 560 180 L 610 180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 750 180 L 800 180" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Loopback Return Arrow -->
  <path d="M 800 240 C 800 340, 100 340, 100 240" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6" />
  <text x="450" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2563eb">Continuous Improvement &amp; Standardized Operations Loop</text>

  <!-- Step 1 Card -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="140" height="140" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="110" cy="140" r="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="110" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">1</text>
    <text x="110" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Scheduled</text>
    <text x="110" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Audit</text>
    <text x="110" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Checklist &amp; scope</text>
  </g>

  <!-- Step 2 Card -->
  <g filter="url(#shadow)">
    <rect x="230" y="110" width="140" height="140" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="300" cy="140" r="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="300" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">2</text>
    <text x="300" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Proof Capture</text>
    <text x="300" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">&amp; Geotag</text>
    <text x="300" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Live photos only</text>
  </g>

  <!-- Step 3 Card -->
  <g filter="url(#shadow)">
    <rect x="420" y="110" width="140" height="140" rx="12" fill="url(#cardGrad)" stroke="#fecaca" stroke-width="1.5" />
    <circle cx="490" cy="140" r="18" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
    <text x="490" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">3</text>
    <text x="490" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Failed Item</text>
    <text x="490" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">Auto-Task</text>
    <text x="490" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Severity SLA set</text>
  </g>

  <!-- Step 4 Card -->
  <g filter="url(#shadow)">
    <rect x="610" y="110" width="140" height="140" rx="12" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <circle cx="680" cy="140" r="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="680" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">4</text>
    <text x="680" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Manager Fix</text>
    <text x="680" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">&amp; Escalation</text>
    <text x="680" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Root cause logged</text>
  </g>

  <!-- Step 5 Card -->
  <g filter="url(#shadow)">
    <rect x="750" y="110" width="120" height="140" rx="12" fill="url(#cardGrad)" stroke="#bbf7d0" stroke-width="1.5" />
    <circle cx="810" cy="140" r="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="810" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#16a34a">✓</text>
    <text x="810" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Verified</text>
    <text x="810" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#16a34a">Closure</text>
    <text x="810" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Photo verified</text>
  </g>
</svg>
